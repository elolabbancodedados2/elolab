    <link rel="canonical" href="https://elolab.com.br/" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0c1f54" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="dns-prefetch" href="https://api.elolab.com.br" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:title" content="EloLab — Gestão para clínicas e laboratórios" />
    <meta property="og:description" content="Agenda, prontuário, financeiro e gestão de laboratório para clínicas. Consulte os planos e recursos do EloLab." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://elolab.com.br/" />

    <meta property="og:site_name" content="EloLab" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EloLab — Gestão inteligente para clínicas e laboratórios" />
    <meta name="twitter:description" content="Agenda, prontuário, financeiro e gestão de laboratório para clínicas. Consulte os planos e recursos do EloLab." />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "EloLab",
      "applicationCategory": "HealthApplication",
      "operatingSystem": "Web",
      "description": "Plataforma de gestão para clínicas com agenda, prontuário, financeiro e recursos para laboratórios.",
      "url": "https://elolab.com.br",
      "author": {
        "@type": "Organization",
        "name": "EloLab",
        "url": "https://elolab.com.br"
      }
    }
    </script>
  </head>

  <body>
    <div id="root">
      <style>
        #initial-loader{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 42%,rgba(15,123,253,.08),transparent 34%),#e0ebf2;color:#0c1f54;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center;z-index:9999}
        #initial-loader .content{width:min(100%,420px)}
        #initial-loader .identity{display:flex;align-items:center;justify-content:center}
        #initial-loader img{display:block;width:min(100%,280px);height:auto;object-fit:contain}
        #initial-loader .brand{display:none}
        #initial-loader .progress{position:relative;width:144px;height:3px;overflow:hidden;border-radius:999px;background:rgba(12,31,84,.14);margin:27px auto 21px}
        #initial-loader .progress span{position:absolute;inset:0 auto 0 0;width:38%;border-radius:inherit;background:#005ecc;animation:il-glide 1.35s ease-in-out infinite}
        #initial-loader .msg{margin:0;color:#0c1f54;font-size:16px;font-weight:600;letter-spacing:-.02em}
        #initial-loader .detail{margin:7px 0 0;color:#52647b;font-size:13px;line-height:1.55}
        #initial-loader .retry,#initial-loader .slow-copy{display:none}
        #initial-loader .retry{min-height:42px;align-items:center;justify-content:center;margin-top:19px;padding:0 16px;border:1px solid rgba(0,94,204,.22);border-radius:11px;background:#fff;color:#005ecc;font-size:13px;font-weight:600;text-decoration:none}
        #initial-loader.is-slow .progress span{animation:none;width:100%;opacity:.55}
        #initial-loader.is-slow .slow-copy{display:block}
        #initial-loader.is-slow .normal-copy{display:none}
        #initial-loader.is-slow .retry{display:inline-flex}
        @keyframes il-glide{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
        @media(prefers-reduced-motion:reduce){#initial-loader .progress span{animation:none;width:100%;opacity:.55}}
      </style>
      <div id="initial-loader">
        <div class="content">
          <div class="identity"><img src="/elolab-logo-horizontal.png" alt="EloLab" width="280" height="81" /></div>
          <div class="progress" aria-hidden="true"><span></span></div>
          <p class="msg normal-copy">Preparando seu espaço de cuidado</p>
          <p class="detail normal-copy">Agenda, prontuários e equipe estarão prontos em instantes.</p>
          <p class="msg slow-copy">O carregamento está demorando</p>
          <p class="detail slow-copy">Confira sua conexão e tente abrir o app novamente.</p>
          <a class="retry" href="">Tentar novamente</a>
        </div>
      </div>
      <script src="/loader-timeout.js" defer></script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
