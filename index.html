<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>EloLab — Gestão para clínicas e laboratórios</title>
    <meta name="description" content="Agenda, prontuário, financeiro e gestão de laboratório para clínicas. Consulte os planos, recursos e condições de acesso ao EloLab." />
    <meta name="author" content="EloLab" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://elolab.com.br/" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#6bcfa4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EloLab" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-TileColor" content="#6bcfa4" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- Perf: early connect to backend/CDN -->
    <link rel="preconnect" href="https://api.elolab.com.br" crossorigin />
    <link rel="dns-prefetch" href="https://api.elolab.com.br" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:title" content="EloLab — Gestão para clínicas e laboratórios" />
    <meta property="og:description" content="Agenda, prontuário, financeiro e gestão de laboratório para clínicas. Consulte os planos e recursos do EloLab." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://elolab.com.br/" />
    <meta property="og:image" content="https://elolab.com.br/pwa-512x512.png" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="EloLab" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EloLab — Gestão inteligente para clínicas e laboratórios" />
    <meta name="twitter:description" content="Agenda, prontuário, financeiro e gestão de laboratório para clínicas. Consulte os planos e recursos do EloLab." />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "EloLab",
      "applicationCategory": "HealthApplication",
      "operatingSystem": "Web",
      "description": "Plataforma de gestão para clínicas com agenda, prontuário, financeiro e recursos para laboratórios.",
      "url": "https://elolab.com.br",
      "author": {
        "@type": "Organization",
        "name": "EloLab",
        "url": "https://elolab.com.br"
      }
    }
    </script>
  </head>

  <body>
    <div id="root">
      <style>
        #initial-loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#eef0f2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;z-index:9999}
        #initial-loader .brand{font-size:28px;font-weight:700;color:#0f172a;letter-spacing:-0.02em}
        #initial-loader .brand span{color:#10b981}
        #initial-loader .spinner{width:40px;height:40px;border-radius:50%;border:3px solid rgba(16,185,129,.15);border-top-color:#10b981;animation:il-spin .8s linear infinite}
        #initial-loader .msg{font-size:13px;color:#64748b}
        @keyframes il-spin{to{transform:rotate(360deg)}}
      </style>
      <div id="initial-loader">
        <div class="brand">Elo<span>Lab</span></div>
        <div class="spinner"></div>
        <div class="msg">Carregando seu ambiente...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
