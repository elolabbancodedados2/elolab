name: Validate image for Easypanel

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Static integrity checks
        run: |
          npm run check:colunas
          npm run check:falhas
          npm run check:permissoes
          npm run check:a11y

      - name: Unit and integration tests
        run: npm run test:run

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Build Docker image
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          docker build \
            --build-arg VITE_SUPABASE_URL="$VITE_SUPABASE_URL" \
            --build-arg VITE_SUPABASE_PUBLISHABLE_KEY="$VITE_SUPABASE_PUBLISHABLE_KEY" \
            -t elolab-frontend:ci .

  deploy:
    name: Deploy to Easypanel
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Trigger the configured Easypanel app deployment
        env:
          EASYPANEL_DEPLOY_TRIGGER_URL: ${{ secrets.EASYPANEL_DEPLOY_TRIGGER_URL }}
        run: |
          if [ -z "$EASYPANEL_DEPLOY_TRIGGER_URL" ]; then
            echo "Missing repository Actions secret: EASYPANEL_DEPLOY_TRIGGER_URL" >&2
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 \
            --request POST \
            --output /dev/null \
            "$EASYPANEL_DEPLOY_TRIGGER_URL"

