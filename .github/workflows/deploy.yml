name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Static integrity checks
        run: |
          npm run check:colunas
          npm run check:falhas
          npm run check:permissoes
          npm run check:a11y

      - name: Unit and integration tests
        run: npm run test:run

      - name: Dependency audit
        shell: bash
        run: |
          set +e
          audit_output="$(npm audit --audit-level=high 2>&1)"
          audit_status=$?
          set -e
          printf '%s\n' "$audit_output"
          if [ "$audit_status" -eq 0 ]; then
            exit 0
          fi
          if printf '%s' "$audit_output" | grep -Eq '503 Service Unavailable|audit endpoint returned an error'; then
            echo '::warning::O endpoint de auditoria do npm está indisponível; o lockfile não foi alterado neste deploy.'
            exit 0
          fi
          exit "$audit_status"

      - name: Install E2E browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run test:e2e -- --workers=4

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=elolab-app --branch=main --commit-dirty=true

      - name: Verify production after deploy
        env:
          PRODUCAO_URL: https://app.elolab.com.br
        run: |
          # Cloudflare Pages pode servir o HTML novo antes de todos os POPs
          # enxergarem os chunks correspondentes. Revalidar após um intervalo
          # distingue propagação eventual de uma regressão persistente.
          for tentativa in 1 2 3; do
            npx playwright test tests/producao-smoke.spec.ts --reporter=line && exit 0
            [ "$tentativa" -eq 3 ] && exit 1
            sleep 15
          done
