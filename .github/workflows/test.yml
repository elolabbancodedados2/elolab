name: Tests

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
  CLINICA_A_EMAIL: ${{ secrets.CLINICA_A_EMAIL }}
  CLINICA_A_SENHA: ${{ secrets.CLINICA_A_SENHA }}
  CLINICA_B_EMAIL: ${{ secrets.CLINICA_B_EMAIL }}
  CLINICA_B_SENHA: ${{ secrets.CLINICA_B_SENHA }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  static-checks:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      # Pega escrita em coluna que não existe no banco. O supabase-js não lança
      # em erro de API, então esse tipo de erro falha em silêncio — já custou
      # quatro bugs neste projeto (nota fiscal, autorização de convênio,
      # auditoria LGPD e altura da triagem).
      - run: npm run check:colunas
      # Pega escrita seguida de "sucesso!" sem checar o erro. Mesma raiz do
      # check acima: o supabase-js não lança em erro de API, então a tela
      # anuncia algo que não aconteceu.
      - run: npm run check:falhas
      # Pega menu e rota discordando sobre quem acessa a tela. O sintoma é o
      # usuário clicar num item que existe e receber "sem permissão" — foi o
      # caso do médico e a fila. E o inverso: tela liberada que ninguém acha,
      # que aconteceu em outras quatro. Atenção ao aninhamento: o menu filtra
      # por grupo E por item, então incluir o papel só no item não resolve.
      - run: npm run check:permissoes
      # Pega botão que só tem ícone e nenhum nome acessível: o leitor de tela
      # anuncia apenas "botão", e nesse sistema um deles apaga prontuário. Roda
      # com teto igual à dívida atual (61) — o objetivo é impedir que CRESÇA.
      # Ao corrigir um lote, baixe o teto no package.json.
      - run: npm run check:a11y
      # Bloqueante: os erros de lint foram zerados (eram 12, todos @ts-nocheck).
      # Os ~860 avisos de `any` herdados não quebram o build — o eslint só
      # retorna código de erro quando há erro de verdade.
      - run: npm run lint
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Supabase database lint
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: npx supabase link --project-ref gebygucrpipaufrlyqqj && npx supabase db lint --linked --level warning

  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:run

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    # Bloqueante desde 2026-07-30. O continue-on-error existia porque o job
    # nunca tinha chegado a rodar (dependia de unit-tests, que estourava
    # memória). Verificado no log do CI: 18 passam, 0 falham. Manter como
    # informativo agora só serviria para deixar regressão passar despercebida.
    #
    # Os 19 testes de RLS ficavam PULADOS por falta do secret com a chave anon,
    # então o job passava verde sem nunca ter checado vazamento de dados. A
    # spec agora lê a chave do client.ts quando a variável não existe — ela é
    # pública, vai no bundle de todo jeito.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
