services:
  api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: elolab-evolution-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_NAME: elolab-evolution
      SERVER_PORT: "8080"
      SERVER_URL: http://evolution-api:8080
      DEL_INSTANCE: "false"
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?Configure EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD:?Configure EVOLUTION_DB_PASSWORD}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: elolab_evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:${EVOLUTION_REDIS_PASSWORD:?Configure EVOLUTION_REDIS_PASSWORD}@redis:6379/0
      CACHE_REDIS_PREFIX_KEY: elolab_evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      TELEMETRY_ENABLED: "false"
      CORS_ORIGIN: https://app.elolab.com.br,https://api.elolab.com.br
      CORS_METHODS: GET,POST,PUT,DELETE
      CORS_CREDENTIALS: "true"
      LOG_LEVEL: ERROR,WARN,INFO
      LOG_BAILEYS: error
      QRCODE_LIMIT: "30"
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      evolution_private:
      supabase_functions:
        aliases:
          - evolution-api
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  postgres:
    image: postgres:15-alpine
    container_name: elolab-evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:?Configure EVOLUTION_DB_PASSWORD}
    volumes:
      - evolution_postgres:/var/lib/postgresql/data
    networks:
      - evolution_private
    healthcheck:
      test: [CMD-SHELL, pg_isready -U evolution -d evolution]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: elolab-evolution-redis
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --requirepass, ${EVOLUTION_REDIS_PASSWORD:?Configure EVOLUTION_REDIS_PASSWORD}]
    environment:
      EVOLUTION_REDIS_PASSWORD: ${EVOLUTION_REDIS_PASSWORD:?Configure EVOLUTION_REDIS_PASSWORD}
    volumes:
      - evolution_redis:/data
    networks:
      - evolution_private
    healthcheck:
      test: [CMD-SHELL, 'redis-cli -a "$${EVOLUTION_REDIS_PASSWORD}" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  evolution_instances:
  evolution_postgres:
  evolution_redis:

networks:
  evolution_private:
    internal: true
  supabase_functions:
    external: true
    name: elolab_supabase_default
